spring.application.name=secure-file-sharing-platform

spring.datasource.url=jdbc:postgresql://postgres:5432/filesharingdb
spring.datasource.username=postgres
spring.datasource.password=${POSTGRES_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

jwt.secret=${JWT_SECRET}

file.upload-dir=/app/uploads

file.encryption-key=${FILE_ENCRYPTION_KEY}

# Redis Configuration
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Email configuration (Example using Gmail SMTP)

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

